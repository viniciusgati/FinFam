name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: npm run typecheck
        run: npm run typecheck
      - name: npm run lint
        run: npm run lint
      - name: npm test
        run: npm test
      - name: npm run build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finfam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finfam_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finfam_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm ci
        run: npm ci
      - name: npm run db:deploy
        run: npm run db:deploy
      - name: npm run test:integration
        run: npm run test:integration
